<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3" />
      <stop offset="25%" stop-color="#E5C158" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="75%" stop-color="#AA7C11" />
      <stop offset="100%" stop-color="#6B4E03" />
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1A" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
  </defs>
  <!-- Base Shield / Ingot -->
  <rect width="100" height="100" rx="20" fill="url(#darkGrad)" stroke="url(#goldGrad)" stroke-width="3"/>
  <!-- Gold Ingot Geometry -->
  <polygon points="20,40 50,22 80,40 50,58" fill="url(#goldGrad)" opacity="0.95" />
  <polygon points="20,40 50,58 50,78 20,60" fill="#996F0A" />
  <polygon points="80,40 50,58 50,78 80,60" fill="#D4AF37" />
  <!-- Monogram SS in Gold -->
  <path d="M44 42 C44 38, 56 38, 56 42 C56 45, 44 47, 44 51 C44 55, 56 55, 56 51" stroke="#050505" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Small Star / Purity Accent -->
  <circle cx="50" cy="22" r="3" fill="#FFF2A3" />
</svg>
